<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="fanglle.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500&amp;family=Big+Shoulders+Display:wght@100;200;300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0A0E}
a{color:#F1ECE4}a:hover{color:#FFFDF8}
</style>
</helmet>
<div class="stage gel-thu" style="position: relative; width: 1440px; height: 900px; background: var(--blackout); color: var(--tungsten); font-family: var(--body); overflow: hidden; display: flex; align-items: center; justify-content: center">
  <div class="beam narrow" style="height: 100%; top: 0; opacity: .22"></div>
  <form style="position: relative; width: 420px; display: flex; flex-direction: column; gap: 18px">
    <span class="mark">The Fanglle <span class="ii">II</span></span>
    <h1 class="d" style="font-size: 56px; margin-top: 18px">Staff sign in</h1>
    <p style="margin: 0; font-size: 16px; color: var(--muted)">For the door team and managers.</p>
    <div class="field"><label for="lg-mail">Email</label><input id="lg-mail" class="input" type="email" autocomplete="username"></div>
    <div class="field">
      <label for="lg-pass">Password</label>
      <div style="position: relative"><input id="lg-pass" class="input" type="password" autocomplete="current-password" style="padding-right: 76px"><button type="button" style="position: absolute; right: 4px; top: 4px; height: 44px; padding: 0 14px; background: transparent; border: 0; color: var(--soft); font: 500 14px var(--body); cursor: pointer">Show</button></div>
    </div>
    <button class="btn btn-work btn-wide" type="button">Sign in</button>
    <p class="help">Forgot your password? Ask a manager to send you a new link.</p>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
